services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zarflow}
      POSTGRES_USER: ${POSTGRES_USER:-zarflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zarflow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zarflow} -d ${POSTGRES_DB:-zarflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-zarflow}
      POSTGRES_USER: ${POSTGRES_USER:-zarflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zarflow}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ZARFLOW_JWT_SECRET: ${ZARFLOW_JWT_SECRET}
      ZARFLOW_CORS_ALLOWED_ORIGINS: ${ZARFLOW_CORS_ALLOWED_ORIGINS}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL}
      ZARFLOW_MINI_APP_URL: ${ZARFLOW_MINI_APP_URL}
      ZARFLOW_TELEGRAM_REGISTER_WEBHOOK: ${ZARFLOW_TELEGRAM_REGISTER_WEBHOOK:-false}
    ports:
      - "8080:8080"

volumes:
  pgdata:
