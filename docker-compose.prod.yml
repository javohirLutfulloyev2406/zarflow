services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zarflow
      POSTGRES_USER: zarflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "work_mem=2MB"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zarflow -d zarflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  backend:
    image: ghcr.io/${GHCR_OWNER}/zarflow-backend:${IMAGE_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ZARFLOW_BUILD_SHA: ${ZARFLOW_BUILD_SHA:-unknown}
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 600m
    restart: unless-stopped

  web:
    image: ghcr.io/${GHCR_OWNER}/zarflow-web:${IMAGE_TAG:-latest}
    environment:
      ZARFLOW_DOMAIN: ${ZARFLOW_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    mem_limit: 96m
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
