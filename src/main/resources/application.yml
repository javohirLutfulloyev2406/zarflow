spring:
  application:
    name: zarflow
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

zarflow:
  default-timezone: Asia/Tashkent
  auth:
    bot-token: ${TELEGRAM_BOT_TOKEN}
  jwt:
    secret: ${ZARFLOW_JWT_SECRET}
  cors:
    allowed-origins: ${ZARFLOW_CORS_ALLOWED_ORIGINS:}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET}
    webhook-url: ${TELEGRAM_WEBHOOK_URL:}
    mini-app-url: ${ZARFLOW_MINI_APP_URL}
    register-webhook: ${ZARFLOW_TELEGRAM_REGISTER_WEBHOOK:false}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:zarflow}
    username: ${POSTGRES_USER:zarflow}
    password: ${POSTGRES_PASSWORD:zarflow}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
